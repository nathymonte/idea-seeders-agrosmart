services:
  agrosmart:
    build:
      context: .
      target: dashboard
    ports:
      - "${AGROSMART_DASHBOARD_PORT:-8501}:8501"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SENSOR_TOPIC: sensor-readings
      DATA_LAKE_PATH: /app/data_lake
      AGROSMART_THRESHOLDS_PATH: /app/config/thresholds.yaml
    volumes:
      - ./input_images:/app/input_images
      - ./output:/app/output
      - ./models:/app/models
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "dashboard", "--url", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  data-lake-consumer:
    build:
      context: .
      target: dashboard
    command: python scripts/sensor_consumer.py
    profiles:
      - streaming
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SENSOR_TOPIC: sensor-readings
      DATA_LAKE_PATH: /app/data_lake
      AGROSMART_THRESHOLDS_PATH: /app/config/thresholds.yaml
      AGROSMART_REFINE_EVERY: 10
      AGROSMART_REFINE_SECONDS: 5
    volumes:
      - ./data_lake:/app/data_lake
      - ./output:/app/output
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "consumer", "--max-age", "60"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  sensor-simulator:
    build:
      context: .
      target: dashboard
    command: >
      python -m src.streaming.producer --count 0 --interval ${AGROSMART_SIM_INTERVAL:-2}
      --scenario mixed --fields TALHAO-01 TALHAO-02 TALHAO-03
      --invalid-rate 0.05 --duplicate-rate 0.03 --seed ${AGROSMART_SIM_SEED:-7}
    profiles:
      - streaming
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SENSOR_TOPIC: sensor-readings
      AGROSMART_THRESHOLDS_PATH: /app/config/thresholds.yaml
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "producer", "--max-age", "60"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      data-lake-consumer:
        condition: service_started
    restart: unless-stopped

  image-processing:
    build:
      context: .
      target: vision
    profiles: [vision]
    environment:
      DATA_LAKE_PATH: /app/data_lake
      AGROSMART_IMAGE_CSV: /app/output/classificacoes.csv
    volumes:
      - ./input_images:/app/input_images:ro
      - ./models:/app/models:ro
      - ./output:/app/output
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs

  process-mining:
    build:
      context: .
      target: analysis
    profiles: [analysis]
    volumes:
      - ./logs:/app/logs:ro
      - ./output:/app/output

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data

volumes:
  kafka-data:
